name: Run Telegram Job Finder Bot

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: job-finder-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot for ~5h25m
        env:
          # در اینجا همه متغیرها را به پایتون می‌دهیم
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          MAIN_CHANNEL_ID: ${{ secrets.MAIN_CHANNEL_ID }}
          MAIN_CHANNEL_LINK: ${{ secrets.MAIN_CHANNEL_LINK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "Starting Job Finder Bot..."
          # دستور timeout را کمی تغییر دادیم تا اگر خطایی رخ داد، در لاگ‌ها قرمز شود
          timeout 19500 python bot.py || echo "Bot stopped before time limit"

      - name: Trigger next run (self-redispatch)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Dispatching next run..."
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/dispatches" \
            -d '{"ref":"main"}'
